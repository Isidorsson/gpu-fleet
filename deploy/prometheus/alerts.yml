groups:
  - name: gpu-fleet
    rules:
      - alert: GPUFatalXid
        expr: gpu_agent_gpu_healthy == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "GPU {{ $labels.gpu }} on {{ $labels.Hostname }}{{ if $labels.node_id }} (node_id {{ $labels.node_id }}){{ end }} is unhealthy"
          description: "{{ $labels.modelName }} {{ $labels.UUID }} on {{ $labels.Hostname }} (gpu {{ $labels.gpu }}{{ if $labels.node_id }}, node_id {{ $labels.node_id }}{{ end }}) has reported gpu_agent_gpu_healthy 0 for 1m: uncorrected ECC errors or a fatal XID."

      - alert: QuarantineSpike
        expr: sum(increase(provisioner_events_total{event=~"inspection_failed|attestation_failed|wipe_failed|hardware_fault"}[15m])) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Nodes are being quarantined faster than expected"
          description: "{{ $value | humanize }} inspection_failed, attestation_failed, wipe_failed and hardware_fault events in the last 15m (threshold 5)."

      - alert: GPUAgentDown
        expr: up{job="gpu-agent"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "GPU agent {{ $labels.instance }} is down"
          description: "Prometheus has failed to scrape the GPU agent at {{ $labels.instance }} for 2m."

      - alert: GPUAgentStale
        expr: time() - gpu_agent_last_sample_timestamp_seconds > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "GPU agent on {{ $labels.Hostname }} has stopped sampling"
          description: "The agent on {{ $labels.Hostname }} last sampled its GPUs {{ $value | humanizeDuration }} ago."

      - alert: ControlPlaneDown
        expr: up{job="controlplane"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Control plane {{ $labels.instance }} is down"
          description: "Prometheus has failed to scrape the control plane at {{ $labels.instance }} for 2m."

      - alert: ReservationDegraded
        expr: increase(reservation_degraded_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "A reservation is running with fewer nodes than requested"
          description: 'Degraded reservation starts in the last 15m: {{ $value | printf "%.0f" }}. A quarantined node could not be replaced within the reservation''s placement policy.'

      - alert: AttestationFailure
        expr: increase(attestations_total{verdict="fail"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "A node failed tenant attestation"
          description: 'Failed attestations in the last 15m on {{ $labels.instance }}: {{ $value | printf "%.0f" }}. Each failing node is quarantined as attestation_failed; the reasons are in the control plane log and in GET /v1/nodes/{id}/attestation.'

      - alert: RemediationRateLimited
        expr: increase(remediation_actions_total{outcome="rate_limited"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Automatic remediation hit its rate limit"
          description: 'Quarantines refused by the remediation rate limit in the last 15m on {{ $labels.instance }}: {{ $value | printf "%.0f" }}. The platform has stopped taking nodes out of service on its own, so nodes with fatal GPU errors may still be in service. Review GET /v1/remediations and quarantine the failing nodes by hand.'
