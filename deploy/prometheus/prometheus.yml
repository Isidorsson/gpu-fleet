global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: controlplane
    static_configs:
      - targets: ["host.docker.internal:8080"]
  # 9400 matches NVIDIA dcgm-exporter, so dashboards work against either.
  - job_name: gpu-agent
    dns_sd_configs:
      - names: [agent]
        type: A
        port: 9400
