# Kubernetes variant of deploy/prometheus/prometheus.yml: the control plane is
# the `controlplane` Service instead of host.docker.internal.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: controlplane
    static_configs:
      - targets: ["controlplane:8080"]
  # `agent` is a headless Service, so its A records are every agent pod.
  - job_name: gpu-agent
    dns_sd_configs:
      - names: [agent]
        type: A
        port: 9400
