# Kubernetes variant of deploy/alertmanager/alertmanager.yml: the webhook goes
# to the `controlplane` Service and the token is a mounted Secret.
route:
  receiver: "null"
  group_by: [alertname, node_id]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  routes:
    - matchers: [alertname="GPUFatalXid"]
      receiver: remediation

receivers:
  - name: "null"
  - name: remediation
    webhook_configs:
      - url: http://controlplane:8080/v1/alerts
        send_resolved: true
        http_config:
          authorization:
            credentials_file: /etc/alertmanager-secrets/webhook_token
