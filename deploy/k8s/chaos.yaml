# Chaos defaults (http://controlplane:8080, http://bmcsim:8443,
# http://agent-node-00N:9400) are the Service names here, as in compose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: chaos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chaos
    spec:
      containers:
        - name: chaos
          image: gpu-fleet-chaos:dev
          envFrom:
            - secretRef:
                name: bmc-credentials
