# bmcsim injects transient 503s, so readiness is a TCP check, not HTTP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmcsim
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bmcsim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bmcsim
    spec:
      containers:
        - name: bmcsim
          image: gpu-fleet-bmcsim:dev
          envFrom:
            - secretRef:
                name: bmc-credentials
          ports:
            - containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: 8443
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bmcsim
spec:
  selector:
    app.kubernetes.io/name: bmcsim
  ports:
    - port: 8443
