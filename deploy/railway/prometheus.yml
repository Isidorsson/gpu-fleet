# Railway variant of deploy/prometheus/prometheus.yml: services are reached
# by their private DNS names instead of compose service names.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager.railway.internal:9093"]

scrape_configs:
  - job_name: controlplane
    static_configs:
      - targets: ["controlplane.railway.internal:8081"]
  - job_name: gpu-agent
    static_configs:
      - targets:
          - agent-node-001.railway.internal:9400
          - agent-node-002.railway.internal:9400
