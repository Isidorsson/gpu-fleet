# Local dev stack. The control plane runs on the host and is scraped through
# host.docker.internal; Alertmanager posts remediation webhooks back to it.
# Agents run here on the fake GPU backend, one per simulated host, all behind
# the DNS name `agent`.
x-agent: &agent
  build:
    context: ../agent
    dockerfile: Dockerfile
  image: gpu-fleet-agent:dev
  networks:
    default:
      aliases: [agent]

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet-dev-only
      POSTGRES_DB: fleet
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet"]
      interval: 5s
      retries: 10

  agent-node-001:
    <<: *agent
    environment:
      AGENT_NODE_ID: node-001
      AGENT_HOSTNAME: node-001
    ports: ["19401:9400"]

  agent-node-002:
    <<: *agent
    environment:
      AGENT_NODE_ID: node-002
      AGENT_HOSTNAME: node-002
    ports: ["19402:9400"]

  agent-node-003:
    <<: *agent
    environment:
      AGENT_NODE_ID: node-003
      AGENT_HOSTNAME: node-003
    ports: ["19403:9400"]

  agent-node-004:
    <<: *agent
    environment:
      AGENT_NODE_ID: node-004
      AGENT_HOSTNAME: node-004
    ports: ["19404:9400"]

  alertmanager:
    image: prom/alertmanager:v0.34.1
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    ports: ["9093:9093"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gpu-fleet.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
