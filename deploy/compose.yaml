# Local dev stack. The control plane runs on the host and is scraped through
# host.docker.internal. Agents run here on the fake GPU backend.
x-agent: &agent
  build:
    context: ../agent
    dockerfile: Dockerfile
  image: gpu-fleet-agent:dev

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet-dev-only
      POSTGRES_DB: fleet
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet"]
      interval: 5s
      retries: 10

  agent:
    <<: *agent
    deploy:
      replicas: 3

  agent-faulty:
    <<: *agent
    environment:
      AGENT_HOSTNAME: agent-faulty
      FAKE_XID: "3:79"

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gpu-fleet.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
