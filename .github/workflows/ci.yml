name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  controlplane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet-ci-only
          POSTGRES_DB: fleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fleet"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fleet:fleet-ci-only@localhost:5432/fleet?sslmode=disable
    defaults:
      run:
        working-directory: controlplane
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: controlplane/go.mod
          cache-dependency-path: controlplane/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f deploy/compose.yaml config -q
      - name: promtool check config, check rules, test rules
        run: |
          image=$(docker compose -f deploy/compose.yaml config --images | grep '^prom/prometheus:')
          promtool() { docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" "$image" "$@"; }
          promtool check config /etc/prometheus/prometheus.yml
          promtool check rules /etc/prometheus/alerts.yml
          promtool test rules /etc/prometheus/alerts_test.yml
      - name: amtool check-config
        run: |
          image=$(docker compose -f deploy/compose.yaml config --images | grep '^prom/alertmanager:')
          docker run --rm --entrypoint amtool -v "$PWD/deploy/alertmanager:/etc/alertmanager:ro" "$image" check-config /etc/alertmanager/alertmanager.yml
      - name: Dashboard JSON
        run: |
          python3 - <<'PY'
          import json

          want = {"type": "prometheus", "uid": "prometheus"}

          def datasources(node):
              if isinstance(node, dict):
                  if "datasource" in node:
                      yield node["datasource"]
                  for value in node.values():
                      yield from datasources(value)
              elif isinstance(node, list):
                  for value in node:
                      yield from datasources(value)

          with open("deploy/grafana/dashboards/gpu-fleet.json", encoding="utf-8") as f:
              dashboard = json.load(f)
          refs = list(datasources(dashboard))
          bad = [ref for ref in refs if ref != want]
          assert refs and not bad, bad
          assert dashboard["uid"] == "gpu-fleet"
          panels = [p for p in dashboard["panels"] if p["type"] != "row"]
          assert panels and all(p["datasource"] == want and p["targets"] for p in panels)
          PY
