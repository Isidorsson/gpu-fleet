name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  controlplane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet-ci-only
          POSTGRES_DB: fleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fleet"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fleet:fleet-ci-only@localhost:5432/fleet?sslmode=disable
    defaults:
      run:
        working-directory: controlplane
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: controlplane/go.mod
          cache-dependency-path: controlplane/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f deploy/compose.yaml config -q
      - name: promtool check config, check rules, test rules
        run: |
          image=$(docker compose -f deploy/compose.yaml config --images | grep '^prom/prometheus:')
          promtool() { docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" "$image" "$@"; }
          promtool check config /etc/prometheus/prometheus.yml
          promtool check rules /etc/prometheus/alerts.yml
          promtool test rules /etc/prometheus/alerts_test.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/k8s/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" "$image" check config /etc/prometheus/prometheus.yml
      - name: amtool check-config
        run: |
          image=$(docker compose -f deploy/compose.yaml config --images | grep '^prom/alertmanager:')
          docker run --rm --entrypoint amtool -v "$PWD/deploy/alertmanager:/etc/alertmanager:ro" "$image" check-config /etc/alertmanager/alertmanager.yml
          docker run --rm --entrypoint amtool -v "$PWD/deploy/k8s:/etc/alertmanager:ro" "$image" check-config /etc/alertmanager/alertmanager.yml
      - name: Kubernetes images match compose
        run: |
          diff <(docker compose -f deploy/compose.yaml --profile demo config --images | sort -u) \
            <(kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/k8s | sed -n 's/^[ -]*image: *//p' | sort -u)
      - name: Dashboard JSON
        run: |
          python3 - <<'PY'
          import json

          want = {"type": "prometheus", "uid": "prometheus"}

          def datasources(node):
              if isinstance(node, dict):
                  if "datasource" in node:
                      yield node["datasource"]
                  for value in node.values():
                      yield from datasources(value)
              elif isinstance(node, list):
                  for value in node:
                      yield from datasources(value)

          with open("deploy/grafana/dashboards/gpu-fleet.json", encoding="utf-8") as f:
              dashboard = json.load(f)
          refs = list(datasources(dashboard))
          bad = [ref for ref in refs if ref != want]
          assert refs and not bad, bad
          assert dashboard["uid"] == "gpu-fleet"
          panels = [p for p in dashboard["panels"] if p["type"] != "row"]
          assert panels and all(p["datasource"] == want and p["targets"] for p in panels)
          PY

  demo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIN_HEALTHY: "40"
      WAIT_SECONDS: "360"
    steps:
      - uses: actions/checkout@v5
      - name: Start the demo profile
        run: docker compose -f deploy/compose.yaml --profile demo up -d --build
      - name: Wait for the fleet to pass inspection and attestation
        run: |
          deadline=$((SECONDS + WAIT_SECONDS))
          while (( SECONDS < deadline )); do
            available=$(curl -fsS --max-time 5 localhost:8080/metrics 2>/dev/null \
              | awk '/^fleet_nodes\{state="(available|provisioning|active)"\}/ { s += $2 } END { if (NR) print int(s) }' || true)
            echo "nodes past inspection (available, provisioning or active): ${available:-n/a} (want >= $MIN_HEALTHY)"
            if [[ -n "$available" ]] && (( available >= MIN_HEALTHY )); then
              exit 0
            fi
            sleep 5
          done
          echo "fewer than $MIN_HEALTHY nodes passed inspection after ${WAIT_SECONDS}s" >&2
          exit 1
      - name: Logs
        if: failure()
        run: |
          docker compose -f deploy/compose.yaml --profile demo ps -a
          docker compose -f deploy/compose.yaml --profile demo logs --no-color --tail 300 chaos controlplane
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose.yaml --profile demo down -v

  k8s-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIN_HEALTHY: "40"
      WAIT_SECONDS: "360"
    steps:
      - uses: actions/checkout@v5
      - name: Build the demo images
        run: docker compose -f deploy/compose.yaml --profile demo build
      - uses: helm/kind-action@v1
        with:
          cluster_name: gpu-fleet
      - name: Load the images into kind
        run: |
          for image in $(docker compose -f deploy/compose.yaml --profile demo config --images | grep '^gpu-fleet-'); do
            kind load docker-image "$image" --name gpu-fleet
          done
      - name: Apply the manifests
        run: kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/k8s | kubectl apply -f -
      - name: Wait for every Deployment
        run: kubectl -n gpu-fleet wait deployment --all --for=condition=Available --timeout=5m
      - name: Wait for the fleet to pass inspection and attestation
        run: |
          kubectl -n gpu-fleet port-forward svc/controlplane 8080:8080 &
          deadline=$((SECONDS + WAIT_SECONDS))
          while (( SECONDS < deadline )); do
            available=$(curl -fsS --max-time 5 localhost:8080/metrics 2>/dev/null \
              | awk '/^fleet_nodes\{state="(available|provisioning|active)"\}/ { s += $2 } END { if (NR) print int(s) }' || true)
            echo "nodes past inspection (available, provisioning or active): ${available:-n/a} (want >= $MIN_HEALTHY)"
            if [[ -n "$available" ]] && (( available >= MIN_HEALTHY )); then
              exit 0
            fi
            sleep 5
          done
          echo "fewer than $MIN_HEALTHY nodes passed inspection after ${WAIT_SECONDS}s" >&2
          exit 1
      - name: Logs
        if: failure()
        run: |
          kubectl -n gpu-fleet get pods -o wide
          kubectl -n gpu-fleet logs deployment/chaos --tail 300
          kubectl -n gpu-fleet logs deployment/controlplane --tail 300
