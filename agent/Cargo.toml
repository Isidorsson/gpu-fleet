[package]
name = "gpu-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
prometheus-client = "0.25.1"
tokio = { version = "=1.53.2", features = ["macros", "net", "rt", "signal", "sync", "time"] }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }

[profile.release]
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
